<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ПЗ2 — Зміна кольору тексту</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@400;700&display=swap');
 
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #555;
      --accent: #FF0000;
    }
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
    }
 
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: 0.05em;
      text-align: center;
      color: var(--text);
    }
 
    h1 span {
      color: var(--accent);
    }
 
    #colorBtn {
      font-family: 'Unbounded', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border: 2px solid var(--border);
      padding: 18px 48px;
      cursor: pointer;
      position: relative;
      transition: color 0.5s ease, border-color 0.5s ease;
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    }
 
    #colorBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--surface);
      z-index: -1;
      clip-path: inherit;
    }
 
    #colorBtn:hover {
      border-color: #444;
    }
 
    #log {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px 24px;
      font-size: 0.8rem;
      line-height: 1.8;
      color: var(--muted);
      min-height: 120px;
    }
 
    #log .line { display: block; }
    #log .ok   { color: #4ade80; }
    #log .err  { color: #f87171; }
    #log .info { color: #60a5fa; }
    #log .val  { color: #facc15; }
 
    #swatch {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--muted);
      transition: background 0.5s ease;
      flex-shrink: 0;
    }
 
    .swatch-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
 
    .swatch-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
 
  <h1><span>Зміна кольору тексту</span></h1>
 
  <button id="colorBtn" onclick="loadColor()">
    Завантажити колір
  </button>
 
  <div class="swatch-row">
    <div id="swatch"></div>
    <span class="swatch-label" id="swatchLabel">очікування…</span>
  </div>
 
  <div id="log">
    <span class="line info">// Натисніть кнопку для старту fetch()</span>
  </div>
 
  <script>
    const log    = document.getElementById('log');
    const btn    = document.getElementById('colorBtn');
    const swatch = document.getElementById('swatch');
    const swLabel = document.getElementById('swatchLabel');
 
    function addLog(text, type = '') {
      const span = document.createElement('span');
      span.className = 'line ' + type;
      span.textContent = text;
      log.appendChild(span);
    }
 
    function loadColor() {
      log.innerHTML = '';
 
      addLog('> fetch("color.json") → надсилаємо запит…', 'info');
 
      fetch('color.json')
        .then(response => {
          addLog(`✓ response.status: ${response.status} ${response.statusText}`, 'ok');
          return response.text();
        })
        .then(rawText => {
          addLog('✓ Отримано текст відповіді:', 'ok');
          addLog(' ' + rawText.trim().replace(/\n\s*/g, ' '), 'val');
 
          const data = JSON.parse(rawText);
          addLog(`✓ JSON.parse() → об'єкт розібрано`, 'ok');
          addLog(` data.color = "${data.color}"`, 'val');
          addLog(` data.label = "${data.label}"`, 'val');
 
          btn.style.color       = data.color;
          btn.style.borderColor = data.color;
          swatch.style.background = data.color;
          swLabel.textContent   = `${data.label} ${data.color}`;
          swLabel.style.color   = data.color;
 
          addLog(`✓ Колір тексту кнопки змінено на ${data.color}`, 'ok');
        })
        .catch(err => {
          addLog('✗ Помилка: ' + err.message, 'err');
        })
        .finally(() => {
          addLog('— finally: запит завершено (успіх або помилка)', 'info');
        });
    }
  </script>
 
</body>
</html>
